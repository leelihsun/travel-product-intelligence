<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="旅遊產品情報中心">
  <title>旅遊產品情報中心</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">Travel Product Intelligence</p>
      <h1>旅遊產品情報中心</h1>
      <p class="subtitle">依營業項目快速掌握競品產品更新、PM Insight 與建議行動。</p>
    </div>
    <div class="sync-status" id="syncStatus">正在載入 Google Sheet…</div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <div class="filter-section">
        <label for="searchInput">搜尋情報</label>
        <input id="searchInput" type="search" placeholder="搜尋競品、功能或關鍵字">
      </div>
      <div class="filter-section">
        <h2>營業項目</h2>
        <div id="productFilters" class="filter-list"></div>
      </div>
      <div class="filter-section">
        <h2>競品</h2>
        <div id="competitorFilters" class="filter-list"></div>
      </div>
      <div class="filter-section">
        <h2>建議行動</h2>
        <div id="actionFilters" class="filter-list"></div>
      </div>
      <button id="resetFilters" class="reset-button" type="button">清除篩選</button>
    </aside>

    <section class="content">
      <div class="summary-row">
        <div>
          <p class="summary-label">目前顯示</p>
          <p class="summary-value"><span id="visibleCount">0</span> 則情報</p>
        </div>
        <select id="sortSelect">
          <option value="newest">日期：新到舊</option>
          <option value="oldest">日期：舊到新</option>
          <option value="competitor">競品名稱</option>
        </select>
      </div>
      <div id="feed" class="feed"></div>
      <div id="emptyState" class="empty-state" hidden>
        <h2>沒有符合條件的情報</h2>
        <p>請調整篩選或搜尋關鍵字。</p>
      </div>
    </section>
  </main>

  <dialog id="detailDialog" class="detail-dialog">
    <button id="closeDialog" class="dialog-close" aria-label="關閉">×</button>
    <div id="detailContent"></div>
  </dialog>

  <script src="config.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
